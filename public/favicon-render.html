<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'DomaineDisplay';
    src: url('/fonts/DomaineDisplay-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; overflow: hidden; background: transparent; }
  .mark {
    width: 512px; height: 512px; border-radius: 50%;
    background: #5e1224;
    display: grid; place-items: center;
  }
  .mark span {
    font-family: 'DomaineDisplay', Georgia, serif;
    font-weight: 700;
    font-size: 360px;
    line-height: 1;
    color: #fff;
    margin-top: -30px;
  }
</style>
</head>
<body>
  <div class="mark"><span>J</span></div>
</body>
</html>
