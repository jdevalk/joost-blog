# Lychee link checker configuration
# https://lychee.cli.rs/usage/config/

exclude_path = []

# Treat 403/401/429 as acceptable (sites blocking bots, rate limiting)
accept = ["100..=429"]

# Give slow hosts more slack before failing. Some valid links (e.g. the
# elar.urfu.ru academic repository) resolve fine in a browser but are slow or
# intermittently unreachable from GitHub runners, so retry before giving up.
timeout = 30
max_retries = 5
retry_wait_time = 2

# Skip URLs that are known-flaky, dead, or are internal paths that no longer exist
exclude = [
    # Academic publishers and paywalled sites that block bots
    "researchgate\\.net",
    "sciencedirect\\.com",
    "igi-global\\.com",
    "d1wqtxts1xzle7\\.cloudfront\\.net",
    "dl\\.acm\\.org",
    "myscp\\.onlinelibrary\\.wiley\\.com",

    # Social platforms that block or rate-limit bots
    "unsplash\\.com",
    "instagram\\.com",
    "youtube\\.com/watch",

    # Sites with aggressive bot protection
    "alfredforum\\.com",
    "newfold\\.com",
    "inc\\.com",
    "nytimes\\.com",
    "axios\\.com",
    "radar\\.cloudflare\\.com",
    "pragmatic\\.agency",
    "core\\.trac\\.wordpress\\.org",
    "meta\\.trac\\.wordpress\\.org",
    "docs\\.astro\\.build",

    # Invalid SSL certs
    "fewertags\\.com",
    "sebastiaans\\.blog",

    # Dead shortlinks and domains
    "wplv\\.io",
    "marketplace\\.emdashcms\\.com",

    # Moved/gone pages
    "webmasters\\.googleblog\\.com",
    "yoast\\.com/joost-transitions",

    # Internal paths that no longer exist (old CMS market share report pages)
    "joost\\.blog/cms/",
    "joost\\.blog/plugins/",
    "joost\\.blog/images/",
]

exclude_all_private = true
