# Lychee link checker configuration
# https://lychee.cli.rs/usage/config/

exclude_path = []

# Skip URLs that block bots, are flaky, are known dead, or are local image assets
exclude = [
    # Sites that block automated requests
    "alfredforum\\.com",
    "researchgate\\.net",
    "sciencedirect\\.com",
    "igi-global\\.com",
    "d1wqtxts1xzle7\\.cloudfront\\.net",
    "newfold\\.com",
    "inc\\.com",
    "core\\.trac\\.wordpress\\.org",
    # YouTube often returns 404 for valid videos when hit by bots
    "youtube\\.com/watch",
    # Dead shortlinks
    "wplv\\.io",
    # Relative image paths resolved against --base become invalid URLs;
    # these are Astro content collection assets processed at build time
    "joost\\.blog/images/",
]

exclude_all_private = true
